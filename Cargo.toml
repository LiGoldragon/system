[package]
name         = "persona-system"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.88"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/persona-system"
description  = "Portable OS and window-manager boundary for Persona."
publish      = false

[lib]
name = "persona_system"
path = "src/lib.rs"

[[bin]]
name = "system"
path = "src/main.rs"

[[bin]]
name = "persona-system-daemon"
path = "src/daemon_main.rs"

[dependencies]
kameo                 = { version = "0.20", default-features = false, features = ["macros", "tracing"] }
nota-codec            = { git = "https://github.com/LiGoldragon/nota-codec.git", branch = "main" }
nota-config           = { git = "https://github.com/LiGoldragon/nota-config.git", branch = "main" }
serde                 = { version = "1", features = ["derive"] }
serde_json            = "1"
signal-core           = { git = "https://github.com/LiGoldragon/signal-core.git" }
signal-frame          = { git = "https://github.com/LiGoldragon/signal-frame.git", branch = "main" }
signal-persona        = { git = "https://github.com/LiGoldragon/signal-persona.git" }
signal-persona-origin   = { git = "https://github.com/LiGoldragon/signal-persona-origin.git" }
signal-persona-system = { git = "https://github.com/LiGoldragon/signal-persona-system.git", branch = "main" }
thiserror             = "2"
tokio                 = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints.rust]
unsafe_code = "forbid"
unused = "warn"
dead_code = "warn"
