[package]
name         = "system"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/system"
description  = "Portable OS and window-manager boundary for Persona."
publish      = false
build        = "build.rs"

[lib]
name = "system"
path = "src/lib.rs"

[[bin]]
name = "system"
path = "src/main.rs"

[[bin]]
name = "meta-system"
path = "src/bin/meta_system.rs"

[[bin]]
name = "system-daemon"
path = "src/daemon_main.rs"

[[bin]]
name = "system-focus"
path = "src/bin/system_focus.rs"

[dependencies]
kameo                 = { git = "https://github.com/LiGoldragon/kameo.git", branch = "main", default-features = false, features = ["macros", "tracing"] }
meta-signal-system    = { git = "https://github.com/LiGoldragon/meta-signal-system.git", branch = "drop-next" }
nota             = { git = "https://github.com/LiGoldragon/nota.git", branch = "main" }
rkyv                  = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
serde                 = { version = "1", features = ["derive"] }
serde_json            = "1"
signal-frame          = { git = "https://github.com/LiGoldragon/signal-frame.git", branch = "drop-next", features = ["nota-text"] }
signal-persona        = { git = "https://github.com/LiGoldragon/signal-persona.git", branch = "drop-next" }
signal-system         = { git = "https://github.com/LiGoldragon/signal-system.git", branch = "drop-next" }
thiserror             = "2"
tokio                 = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
triad-runtime         = { git = "https://github.com/LiGoldragon/triad-runtime.git", branch = "drop-next" }

[build-dependencies]
schema-rust = { git = "https://github.com/LiGoldragon/schema-rust.git", branch = "drop-next" }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = { level = "warn", priority = -1 }

[patch.crates-io]
kameo = { git = "https://github.com/LiGoldragon/kameo.git", branch = "main" }
