[package]
name         = "system"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.88"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/system"
description  = "Portable OS and window-manager boundary for Persona."
publish      = false

[lib]
name = "system"
path = "src/lib.rs"

[[bin]]
name = "system"
path = "src/main.rs"

[[bin]]
name = "system-daemon"
path = "src/daemon_main.rs"

[dependencies]
kameo                 = { version = "0.20", default-features = false, features = ["macros", "tracing"] }
nota-codec            = { git = "https://github.com/LiGoldragon/nota-codec.git", branch = "main" }
rkyv                  = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
serde                 = { version = "1", features = ["derive"] }
serde_json            = "1"
signal-frame          = { git = "https://github.com/LiGoldragon/signal-frame.git", branch = "main" }
signal-persona        = { git = "https://github.com/LiGoldragon/signal-persona.git" }
signal-persona-origin = { git = "https://github.com/LiGoldragon/signal-persona-origin.git" }
signal-system         = { git = "https://github.com/LiGoldragon/signal-system.git", branch = "main" }
thiserror             = "2"
tokio                 = { version = "1", features = ["rt-multi-thread", "macros"] }
triad-runtime         = { git = "https://github.com/LiGoldragon/triad-runtime.git", branch = "main" }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = { level = "warn", priority = -1 }
